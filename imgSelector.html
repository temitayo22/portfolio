<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Responsive Image Gallery</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: #f8f8f8;
    margin: 0;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  /* Filter Buttons */
  .filter-buttons {
    text-align: center;
    margin-bottom: 20px;
  }

  .filter-buttons button {
    background: #fff;
    border: 1px solid #ccc;
    margin: 5px;
    padding: 10px 15px;
    cursor: pointer;
    transition: 0.3s;
    border-radius: 6px;
  }

  .filter-buttons button:hover,
  .filter-buttons button.active {
    background: #333;
    color: white;
  }

  /* Gallery Grid */
  .gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
  }

  .gallery-item {
    position: relative;
    overflow: hidden;
    cursor: pointer;
  }

  .gallery-item img {
    width: 100%;
    display: block;
    border-radius: 10px;
    transition: transform 0.4s ease, filter 0.4s ease;
  }

  .gallery-item:hover img {
    transform: scale(1.05);
    filter: brightness(80%);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    z-index: 10;
    left: 0; top: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  .lightbox img {
    max-width: 90%;
    max-height: 80%;
    border-radius: 10px;
  }

  .close, .prev, .next {
    position: absolute;
    color: white;
    font-size: 2em;
    cursor: pointer;
    user-select: none;
    top: 50%;
    transform: translateY(-50%);
    padding: 10px;
  }

  .close {
    top: 20px;
    right: 30px;
    font-size: 2.5em;
  }

  .prev { left: 5%; }
  .next { right: 5%; }

  @media (max-width: 600px) {
    .prev, .next {
      font-size: 1.5em;
    }
  }
</style>
</head>
<body>

<h1>Beautiful Image Gallery</h1>

<div class="filter-buttons">
  <button class="active" data-filter="all">All</button>
  <button data-filter="nature">Nature</button>
  <button data-filter="city">City</button>
  <button data-filter="animals">Animals</button>
</div>

<div class="gallery">
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1015/400/300" alt="Nature 1"></div>
  <div class="gallery-item" data-category="nature"><img src="https://picsum.photos/id/1025/400/300" alt="Nature 2"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1011/400/300" alt="City 1"></div>
  <div class="gallery-item" data-category="city"><img src="https://picsum.photos/id/1012/400/300" alt="City 2"></div>
  <div class="gallery-item" data-category="animals"><img src="https://picsum.photos/id/1024/400/300" alt="Animals 1"></div>
  <div class="gallery-item" data-category="animals"><img src="https://picsum.photos/id/1020/400/300" alt="Animals 2"></div>
</div>

<!-- Lightbox -->
<div class="lightbox">
  <span class="close">&times;</span>
  <span class="prev">&#10094;</span>
  <img src="" alt="">
  <span class="next">&#10095;</span>
</div>

<script>
  const galleryItems = document.querySelectorAll('.gallery-item');
  const lightbox = document.querySelector('.lightbox');
  const lightboxImg = lightbox.querySelector('img');
  const closeBtn = document.querySelector('.close');
  const nextBtn = document.querySelector('.next');
  const prevBtn = document.querySelector('.prev');
  const filterBtns = document.querySelectorAll('.filter-buttons button');
  
  let currentIndex = 0;

  // Open Lightbox
  galleryItems.forEach((item, index) => {
    item.addEventListener('click', () => {
      lightbox.style.display = 'flex';
      lightboxImg.src = item.querySelector('img').src;
      currentIndex = index;
    });
  });

  // Close Lightbox
  closeBtn.onclick = () => lightbox.style.display = 'none';
  lightbox.onclick = (e) => { if (e.target === lightbox) lightbox.style.display = 'none'; };

  // Next/Prev Navigation
  nextBtn.onclick = () => navigate(1);
  prevBtn.onclick = () => navigate(-1);

  function navigate(direction) {
    currentIndex = (currentIndex + direction + galleryItems.length) % galleryItems.length;
    lightboxImg.src = galleryItems[currentIndex].querySelector('img').src;
  }

  // Filters
  filterBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelector('.filter-buttons .active').classList.remove('active');
      btn.classList.add('active');
      const filter = btn.getAttribute('data-filter');

      galleryItems.forEach(item => {
        item.style.display = (filter === 'all' || item.dataset.category === filter) ? 'block' : 'none';
      });
    });
  });
</script>

</body>
</html>
